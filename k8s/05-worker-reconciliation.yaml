apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciliation-worker
  namespace: fintech-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reconciliation-worker
  template:
    metadata:
      labels:
        app: reconciliation-worker
    spec:
      containers:
        - name: worker
          image: apio/fintech-api:latest
          command: ["node", "dist/worker.js"]
          envFrom:
            - configMapRef:
                name: fintech-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
